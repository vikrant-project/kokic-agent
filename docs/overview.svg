<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="1200" height="580" rx="24" fill="#111016"/><rect x="32" y="32" width="1136" height="516" rx="18" fill="#1c1525" stroke="#493356"/><text x="68" y="90" fill="#d0a5ff" font-family="sans-serif" font-size="30" font-weight="bold">k / KOKIC AGENT</text><text x="68" y="145" fill="#f4eaff" font-family="sans-serif" font-size="42" font-weight="bold">One idea. A team that builds it.</text><text x="68" y="185" fill="#b7a4c5" font-family="sans-serif" font-size="20">Private CLI accounts · Shared project context · Reviewable code</text><rect x="68" y="224" width="680" height="275" rx="14" fill="#120e19"/><text x="96" y="265" fill="#ddc7ef" font-family="sans-serif" font-size="19">PROJECT WORKSPACE</text><text x="96" y="310" fill="#ac8dc1" font-family="sans-serif" font-size="17">Chat  /  Tasks  /  Code  /  Terminal  /  Review</text><rect x="96" y="339" width="622" height="62" rx="10" fill="#33213f"/><text x="115" y="376" fill="#eee1f9" font-family="sans-serif" font-size="18">Describe your idea. Attach a brief. Set a goal.</text><text x="96" y="449" fill="#bda0d1" font-family="sans-serif" font-size="17">Plan → Build → Preview → Review → Finalize</text><rect x="778" y="224" width="350" height="275" rx="14" fill="#261b30"/><text x="804" y="268" fill="#ecdef7" font-family="sans-serif" font-size="20">Your connected team</text><g fill="#bfa6d0" font-family="sans-serif" font-size="17"><text x="804" y="319">● Coordinator · planning</text><text x="804" y="362">● Builder · implementation</text><text x="804" y="405">● Reviewer · verification</text><text x="804" y="464">Isolated Git worktrees</text></g></svg>